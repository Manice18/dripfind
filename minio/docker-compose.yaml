# Single-node MinIO AIStor — required for FREE licenses (nodes: 1).
# Distributed (minio{1...4}) needs a paid license that allows multiple nodes.
services:
  minio:
    image: quay.io/minio/aistor/minio:latest
    hostname: minio
    command: server /data --console-address ":9001" --license /minio.license
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - data:/data
      - ./minio.license:/minio.license:ro
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  data:
