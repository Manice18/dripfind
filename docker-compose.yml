services:
  postgres:
    image: postgres:17-alpine
    container_name: dripfind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-outfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outfit}
      POSTGRES_DB: ${POSTGRES_DB:-dripfind}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-outfit} -d ${POSTGRES_DB:-dripfind}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: dripfind-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data:
